name: X-Bot

on:
  workflow_dispatch:

jobs:
  bot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram test feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          message = (
              "🟢 X-Bot ONLINE\n\n"
              "GitHub → Telegram connection is working.\n"
              "The monitoring engine is ready for the next phase."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
          request = urllib.request.Request(url, data=data, method="POST")

          with urllib.request.urlopen(request, timeout=20) as response:
              body = response.read().decode()
              if '"ok":true' not in body:
                  raise SystemExit(f"Telegram rejected the message: {body}")
              print("Telegram test feed sent successfully.")
          PY
