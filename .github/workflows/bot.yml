name: X-Bot

on:
  workflow_dispatch:
  schedule:
    # TEMP TEST: monitoring every 5 minutes. Restore 10:00, 15:00, 20:00 UTC after test.
    - cron: "*/5 * * * *"

concurrency:
  group: x-bot-monitor
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset Telegram webhook for polling
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/deleteWebhook?drop_pending_updates=false"
          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)
          if not data.get("ok"):
              raise RuntimeError(f"Telegram deleteWebhook failed: {data}")
          print("Telegram webhook removed; polling is enabled.")
          PY

      - name: Process Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_API_KEY: ${{ secrets.TWITTERAPIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m bot.telegram_commands

  monitor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_API_KEY: ${{ secrets.TWITTERAPIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTO_REPLY: "false"
          TEST_MODE: "true"
          TEST_WINDOW_MINUTES: "60"
          SCHEDULE_SLOT: ""
        run: python -m bot.monitor
