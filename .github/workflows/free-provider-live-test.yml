name: Free X Provider Live Test

on:
  push:
    branches:
      - free-x-provider-test

jobs:
  live-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITTERAPIS_X_AUTH_TOKEN: ${{ secrets.TWITTERAPIS_X_AUTH_TOKEN }}
      TWITTERAPIS_CT0: ${{ secrets.TWITTERAPIS_CT0 }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      X_PROVIDER_MODE: twscrape
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Regression tests
        run: pytest -q

      - name: Live provider test
        run: python -m bot.monitor
