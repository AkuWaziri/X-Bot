name: X-Bot Scheduler

on:
  workflow_dispatch:
  # Production schedule in WAT (UTC+1):
  # 12:07 WAT = 11:07 UTC
  # 15:07 WAT = 14:07 UTC
  # 20:07 WAT = 19:07 UTC
  schedule:
    - cron: "7 11 * * *"
    - cron: "7 14 * * *"
    - cron: "7 19 * * *"

concurrency:
  group: x-bot-scheduler
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run regression tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          X_PROVIDER_MODE: "mock"
        run: pytest -q

      - name: Run monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_API_KEY: ${{ secrets.TWITTERAPIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_PROVIDER_MODE: "twitterapis"
          AUTO_REPLY: "false"
          SCHEDULE_SLOT: ""
        run: python -m bot.monitor
