name: X-Bot Scheduled Feed

on:
  workflow_dispatch:
  # Feed every 90 minutes, with two retries for GitHub schedule delays.
  # The monitor records completed slots and ignores duplicate retries.
  schedule:
    - cron: "3 0,3,6,9,12,15,18,21 * * *"
    - cron: "10 0,3,6,9,12,15,18,21 * * *"
    - cron: "18 0,3,6,9,12,15,18,21 * * *"
    - cron: "33 1,4,7,10,13,16,19,22 * * *"
    - cron: "40 1,4,7,10,13,16,19,22 * * *"
    - cron: "48 1,4,7,10,13,16,19,22 * * *"

concurrency:
  group: x-bot-scheduler
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run regression tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          X_PROVIDER_MODE: mock
        run: pytest -q

      - name: Run production monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_X_AUTH_TOKEN: ${{ secrets.TWITTERAPIS_X_AUTH_TOKEN }}
          TWITTERAPIS_CT0: ${{ secrets.TWITTERAPIS_CT0 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_PROVIDER_MODE: fxtwitter
          AUTO_REPLY: "false"
          SCHEDULE_SLOT: ""
          # Manual dispatch runs a bounded five-hour scan for an end-to-end delivery test.
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TEST_WINDOW_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '300' || '10' }}
        run: python -m bot.monitor
