name: X-Bot Scheduled Feed

on:
  workflow_dispatch:
  # GitHub may delay or skip scheduled events, especially at the top of an hour.
  # Run each slot a few minutes after the hour and retry three more times.
  # bot.monitor records completed slots in Supabase to prevent duplicate feeds.
  schedule:
    # 12:00 PM WAT = 11:00 UTC
    - cron: "3 11 * * *"
    - cron: "8 11 * * *"
    - cron: "13 11 * * *"
    - cron: "18 11 * * *"
    # 5:00 PM WAT = 16:00 UTC
    - cron: "3 16 * * *"
    - cron: "8 16 * * *"
    - cron: "13 16 * * *"
    - cron: "18 16 * * *"
    # 9:00 PM WAT = 20:00 UTC
    - cron: "3 20 * * *"
    - cron: "8 20 * * *"
    - cron: "13 20 * * *"
    - cron: "18 20 * * *"

concurrency:
  group: x-bot-scheduler
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run regression tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          X_PROVIDER_MODE: mock
        run: pytest -q

      - name: Run production monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_X_AUTH_TOKEN: ${{ secrets.TWITTERAPIS_X_AUTH_TOKEN }}
          TWITTERAPIS_CT0: ${{ secrets.TWITTERAPIS_CT0 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_PROVIDER_MODE: fxtwitter
          AUTO_REPLY: "false"
          SCHEDULE_SLOT: ""
          # Manual dispatch runs a bounded 10-minute scan for an end-to-end delivery test.
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TEST_WINDOW_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '300' || '10' }}
        run: python -m bot.monitor
