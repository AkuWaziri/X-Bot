name: X-Bot Scheduled Feed

on:
  workflow_dispatch:
  # WAT feed slots: 12:00, 17:00 and 21:00 (UTC: 11:00, 16:00 and 20:00).
  # Two short retries help recover from GitHub Actions schedule delays.
  # The monitor records completed slots and ignores duplicate retries.
  schedule:
    - cron: "0 11,16,20 * * *"
    - cron: "7 11,16,20 * * *"
    - cron: "15 11,16,20 * * *"

concurrency:
  group: x-bot-scheduler
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 15 || 60 }}
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTERAPIS_X_AUTH_TOKEN: ${{ secrets.TWITTERAPIS_X_AUTH_TOKEN }}
          TWITTERAPIS_CT0: ${{ secrets.TWITTERAPIS_CT0 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Scheduled feeds prioritize prompt Telegram delivery; failed suggestions are omitted.
          GROQ_MIN_INTERVAL_SECONDS: "0"
          GROQ_RATE_LIMIT_RETRIES: "0"
          GROQ_VALIDATION_ATTEMPTS: "1"
          X_PROVIDER_MODE: fxtwitter
          AUTO_REPLY: "false"
          SCHEDULE_SLOT: ""
          # Manual dispatch is a short delivery smoke test; scheduled runs retain their normal window.
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TEST_WINDOW_MINUTES: "10"
        run: python -m bot.monitor

  regression-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run regression tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          X_PROVIDER_MODE: mock
        run: pytest -q
